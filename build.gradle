buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'org.docstr.gwt:org.docstr.gwt.gradle.plugin:2.2.9'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

ext {
    gdxVersion = '1.9.14'
}

project(':fumper') {
    apply plugin: 'java-library'

    sourceSets.main.java.srcDirs = ['src']

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    }
}

project(':fumper-desktop') {
    apply plugin: 'application'

    sourceSets.main.java.srcDirs = ['src']

    application {
        mainClass = project.findProperty('mainClass') ?: 'com.python4d.fumper.Main'
    }

    dependencies {
        implementation project(':fumper')
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }

    tasks.named('run', JavaExec) {
        workingDir = rootProject.file('fumper-android/assets')
        jvmArgs += [
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.desktop/sun.awt=ALL-UNNAMED'
        ]
    }
}

project(':fumper-android') {
    apply plugin: 'com.android.application'

    configurations {
        natives
    }

    dependencies {
        implementation project(':fumper')
        implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
    }

    android {
        namespace = 'com.python4d.fumper'
        compileSdk = 34

        defaultConfig {
            applicationId = 'com.python4d.fumper'
            minSdk = 19
            targetSdk = 34
            versionCode = 5
            versionName = "1.05"
        }

        sourceSets {
            main {
                manifest.srcFile 'AndroidManifest.xml'
                java.srcDirs = ['src']
                aidl.srcDirs = ['src']
                renderscript.srcDirs = ['src']
                res.srcDirs = ['res']
                assets.srcDirs = ['assets']
                jniLibs.srcDirs = ['libs']
            }
        }

        buildTypes {
            release {
                minifyEnabled = false
            }
        }

        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
    }

    tasks.register('copyAndroidNatives') {
        doFirst {
            file("${projectDir}/libs/armeabi/").mkdirs()
            file("${projectDir}/libs/armeabi-v7a/").mkdirs()
            file("${projectDir}/libs/arm64-v8a/").mkdirs()
            file("${projectDir}/libs/x86/").mkdirs()
            file("${projectDir}/libs/x86_64/").mkdirs()

            configurations.natives.copy().files.each { jar ->
                def outputDir = null
                if (jar.name.contains("arm64-v8a")) outputDir = file("${projectDir}/libs/arm64-v8a")
                else if (jar.name.contains("armeabi-v7a")) outputDir = file("${projectDir}/libs/armeabi-v7a")
                else if (jar.name.contains("armeabi")) outputDir = file("${projectDir}/libs/armeabi")
                else if (jar.name.contains("x86_64")) outputDir = file("${projectDir}/libs/x86_64")
                else if (jar.name.contains("x86")) outputDir = file("${projectDir}/libs/x86")

                if (outputDir != null) {
                    copy {
                        from zipTree(jar)
                        into outputDir
                        include "*.so"
                    }
                }
            }
        }
    }

    tasks.configureEach { task ->
        if (task.name.startsWith("merge") && task.name.endsWith("JniLibFolders")) {
            task.dependsOn 'copyAndroidNatives'
        }
    }
}

project(':fumper-html') {
    apply plugin: 'java-library'
    apply plugin: 'org.docstr.gwt'
    apply plugin: 'war'

    sourceSets.main.java.srcDirs = ['src', '../fumper/src']

    dependencies {
        implementation project(':fumper')
        implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
        implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
        implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion:sources"
        implementation "com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion:sources"
        implementation "com.google.jsinterop:jsinterop-annotations:2.0.2"
        implementation "com.google.jsinterop:jsinterop-annotations:2.0.2:sources"
    }

    gwt {
        gwtVersion = '2.11.0'
        modules = ['com.python4d.fumper.GwtDefinition']
    }

    tasks.register('distHtml') {
        dependsOn 'gwtCompile'
        doLast {
            def distDir = file("dist")
            distDir.mkdirs()

            // 1. Webapp entry files (index.html, etc.)
            copy {
                from file("webapp")
                into distDir
            }

            // 2. Clean previous cache files and copy compiled GWT JavaScript module
            delete fileTree("${distDir}/html") {
                include "*.cache.js"
            }
            copy {
                from file("build/gwt/war/html")
                into file("${distDir}/html")
            }

            // 3. Preloaded assets from GWT preloader
            copy {
                from file("war/assets")
                into file("${distDir}/assets")
            }

            // 4. Raw assets as direct fallback
            copy {
                from file("../fumper-android/assets")
                into file("${distDir}/assets")
            }

            println "HTML5 web game successfully assembled at: ${distDir.absolutePath}"
        }
    }
}
